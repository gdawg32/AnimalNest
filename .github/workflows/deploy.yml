name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: adept-stage-450409-c1
  SERVICE: animalnest
  REGION: asia-south1
  REPO: animalnest-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker asia-south1-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t asia-south1-docker.pkg.dev/$PROJECT_ID/$REPO/animalnest .

    - name: Push Docker image
      run: |
        docker push asia-south1-docker.pkg.dev/$PROJECT_ID/$REPO/animalnest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE \
          --image asia-south1-docker.pkg.dev/$PROJECT_ID/$REPO/animalnest \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated